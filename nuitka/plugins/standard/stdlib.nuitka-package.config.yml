- module-name: 'pickle' # checksum: a8cca0dd
  anti-bloat:
    - description: 'remove module ability to run as a binary'
      change_function:
        '_test': "'(lambda: None)'"
    - description: 'better error message for pickles using missing modules'
      append_plain: |
        def _nuitka_pickle_wrap_load(func):
            def wrapped(*args, **kwargs):
                try:
                    return func(*args, **kwargs)
                except ImportError as e:
                    module_name = getattr(e, "name", None) or "<unknown>"

                    raise RuntimeError(
                        """Nuitka: Failed to load pickle data, it requires the module '%s' that is not included in the compiled program. Use '--include-module=%s' during compilation, or add 'import %s' to the program."""
                        % (module_name, module_name, module_name)
                    )

            return wrapped

        load = _nuitka_pickle_wrap_load(load)
        loads = _nuitka_pickle_wrap_load(loads)
      when: 'python3_or_higher and not deployment'

