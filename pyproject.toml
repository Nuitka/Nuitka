[build-system]
requires = ["setuptools>=42", "wheel"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

project-excludes = [
    "tests",
    "nuitka/build",
    "nuitka/dist",
    # Runtime template injected into compiled programs; uses runtime-injected names and Python 2 builtins
    "lib/hints.py",
    # Auto-generated node base classes; not hand-edited
    "**/*Generated.py",
]

# Python 2-only modules (inside try/except version guards) and pip-vendored modules not in site-packages
ignore-missing-imports = [
    "__builtin__",
    "exceptions",
    "pip\\._vendor\\..*",
]

# --- Per-file suppression for known noise categories ---

# Optional deps (_tqdm, _rich_*, _colorama) start as None and are set conditionally;
# pyrefly can't see through the None-initialization pattern, producing false positives throughout
[[tool.pyrefly.sub-config]]
matches = "nuitka/Progress.py"

[tool.pyrefly.sub-config.errors]
not-callable = false
missing-attribute = false
bad-assignment = false
missing-import = false
unsupported-operation = false
invalid-inheritance = false
unbound-name = false

# Python 2 compat: ClassType, InstanceType guarded by python_version < 0x300
[[tool.pyrefly.sub-config]]
matches = "nuitka/Builtins.py"

[tool.pyrefly.sub-config.errors]
missing-module-attribute = false

# Dynamic ast.AST subclass attribute access; actual node subtype is resolved at runtime
[[tool.pyrefly.sub-config]]
matches = "nuitka/Bytecodes.py"

[tool.pyrefly.sub-config.errors]
missing-attribute = false

# Pickler.dispatch is a CPython implementation detail absent from typeshed stubs
[[tool.pyrefly.sub-config]]
matches = "nuitka/Serialization.py"

[tool.pyrefly.sub-config.errors]
missing-attribute = false

# Python 2 compat (sys.long_info, SyntaxError.message) + Windows registry (winreg.*) platform guards
[[tool.pyrefly.sub-config]]
matches = "nuitka/PythonVersions.py"

[tool.pyrefly.sub-config.errors]
missing-attribute = false
not-callable = false
no-matching-overload = false
unbound-name = false

# Python 2 operators (operator.div, operator.idiv) guarded by python_version < 0x300
[[tool.pyrefly.sub-config]]
matches = "nuitka/PythonOperators.py"

[tool.pyrefly.sub-config.errors]
missing-attribute = false
unbound-name = false

# Python 2/old-CPython (sys.subversion) and internal distutils._multiarch API
[[tool.pyrefly.sub-config]]
matches = "nuitka/PythonFlavors.py"

[tool.pyrefly.sub-config.errors]
missing-attribute = false
missing-module-attribute = false

# Python 2 sys.flags (py3k_warning, division_warning, unicode) guarded by python_version < 0x300;
# dict value type is widened by callers but typed narrowly
[[tool.pyrefly.sub-config]]
matches = "nuitka/MainControl.py"

[tool.pyrefly.sub-config.errors]
missing-attribute = false
unsupported-operation = false

# ctypes.windll is Windows-only; fcntl.ioctl receives a str where bytes is expected (intentional)
[[tool.pyrefly.sub-config]]
matches = "nuitka/Tracing.py"

[tool.pyrefly.sub-config.errors]
missing-module-attribute = false
no-matching-overload = false

# trust_node_factory dict holds a heterogeneous union of factory types; typed narrowly at init
[[tool.pyrefly.sub-config]]
matches = "nuitka/HardImportRegistry.py"

[tool.pyrefly.sub-config.errors]
unsupported-operation = false

# module_timing_infos stores tuples but the dict is typed as list at declaration
[[tool.pyrefly.sub-config]]
matches = "nuitka/ModuleRegistry.py"

[tool.pyrefly.sub-config.errors]
unsupported-operation = false
