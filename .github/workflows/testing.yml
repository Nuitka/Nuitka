name: Nuitka tests
# makes little sense, spell-checker: disable
on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - main
      - develop
      - factory
      - release/**
      - hotfix/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NUITKA_UPDATE_CHECK: "never"
  NUITKA_CACHE_DIR: ~/.cache/Nuitka

jobs:
  checks:
    runs-on: ubuntu-24.04
    name: Checks
    steps:
      - name: 🛎️ Checkout
        uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea # v3.8.0
        with:
          action: actions/checkout@v4
          with: |
            fetch-depth: 1
            fetch-tags: false
            filter: blob:none
          attempt_limit: 3
          attempt_delay: 120000

      - name: 🐍 Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements-devel.txt
            requirements.txt

      - name: 🧳 Install Nuitka and dependencies
        run: |
          python -m pip install --no-python-version-warning --disable-pip-version-check -r requirements-devel.txt
          python -m pip install --no-python-version-warning --disable-pip-version-check .

      - name: 🔧 Cache Nuitka downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/Nuitka/downloads
          key: nuitka-downloads-${{ runner.os }}-${{ runner.arch }}
          restore-keys: nuitka-downloads-${{ runner.os }}-

      - name: 🔎 PyLint on Nuitka source code
        run: |
          python ./bin/check-nuitka-with-pylint

      - name: 🔎 RestLint on Nuitka source code
        run: |
          python ./bin/check-nuitka-with-restlint

      - name: 🔎 YamlLint on Nuitka source code
        run: |
          python ./bin/check-nuitka-with-yamllint

      - name: 🔎 Codespell on Nuitka source code
        run: |
          python ./bin/check-nuitka-with-codespell

      - name: 🔎 Auto-format check on Nuitka source code
        run: |
          python ./bin/autoformat-nuitka-source --check-only --assume-yes-for-downloads

      - name: 🔎 Specialized C code check
        run: |
          python ./bin/generate-specialized-c-code --check

      - name: 🔎 Specialized Python code check
        run: |
          python ./bin/generate-specialized-python-code --check

  linux:
    needs: checks
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python_version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    name: Ubuntu Python ${{ matrix.python_version }}
    steps:
      - name: 🛎️ Checkout
        uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea # v3.8.0
        with:
          action: actions/checkout@v4
          with: |
            fetch-depth: 1
            fetch-tags: false
            filter: blob:none
          attempt_limit: 3
          attempt_delay: 120000

      - name: 🐍 Use Python ${{ matrix.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}
          cache: "pip"
          cache-dependency-path: |
            requirements-devel.txt
            requirements.txt

      - name: 📦 Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-patchelf-gdb-ccache-libfuse2
          restore-keys: apt-${{ runner.os }}-

      - name: 🧳 Install Nuitka and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install patchelf gdb ccache libfuse2
          python -m pip install --no-python-version-warning --disable-pip-version-check -r requirements-devel.txt
          python -m pip install --no-python-version-warning --disable-pip-version-check .

      - name: 🔧 Cache ccache data
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ matrix.python_version }}-${{ hashFiles('requirements.txt', 'requirements-devel.txt') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.python_version }}-
            ccache-${{ runner.os }}-

      - name: 🔧 Cache Nuitka downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/Nuitka/downloads
          key: nuitka-downloads-${{ runner.os }}-${{ runner.arch }}
          restore-keys: nuitka-downloads-${{ runner.os }}-

      - name: ⚙️ Verbose scons output in compilation
        run: |
          set -x
          python -m nuitka --mode=module --show-scons --run --report=compilation-report-module.xml --assume-yes-for-downloads --experimental=debug-report-traceback tests/basics/EmptyModuleTest.py
          python -m nuitka --mode=accelerated --show-scons --run --report=compilation-report-accelerated.xml --assume-yes-for-downloads --experimental=debug-report-traceback tests/basics/EmptyModuleTest.py
          python -m nuitka --mode=standalone --show-scons --run --report=compilation-report-standalone.xml --assume-yes-for-downloads --experimental=debug-report-traceback tests/basics/EmptyModuleTest.py
          readelf -d EmptyModuleTest.dist/EmptyModuleTest.bin | tee standalone-binary-readelf.txt
          ldd EmptyModuleTest.dist/EmptyModuleTest.bin | tee standalone-binary-ldd.txt
          python -m nuitka --mode=onefile --show-scons --run --report=compilation-report-onefile.xml --assume-yes-for-downloads --experimental=debug-report-traceback tests/basics/EmptyModuleTest.py
        shell: bash

      - name: 📤 Archive compilation reports for empty modules
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compilation-reports-${{ runner.os }}-${{ matrix.python_version }}

          path: |
            *.xml
            standalone-binary-readelf.txt
            standalone-binary-ldd.txt

      # This can be used to ssh into GitHub actions if debugging is needed.
      # - uses: actions/checkout@v4
      # - name: Setup upterm session
      #   uses: lhotari/action-upterm@v1
      #   with:
      #     ## limits ssh access and adds the ssh public keys of the listed GitHub users
      #     limit-access-to-users: kayhayen

      - name: 🧪 Run Nuitka test suite
        run: |
          python -m nuitka --version
          env | sort
          python ./tests/run-tests --no-other-python --skip-reflection-test --skip-all-cpython-tests --assume-yes-for-downloads

  mac-python3:
    needs: linux
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python_version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    name: macOS Python ${{ matrix.python_version }}
    steps:
      - name: 🛎️ Checkout
        uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea # v3.8.0
        with:
          action: actions/checkout@v4
          with: |
            fetch-depth: 1
            fetch-tags: false
            filter: blob:none
          attempt_limit: 3
          attempt_delay: 120000

      - name: 🐍 Use Python ${{ matrix.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}
          cache: "pip"
          cache-dependency-path: |
            requirements-devel.txt
            requirements.txt

      - name: ⚙️ Verbose installation output for Python
        run: |
          set -x
          which python
          otool -L $(which python)
          otool -l $(which python)
          ls -lR $(dirname $(dirname $(which python)))

      - name: 🧳 Install Nuitka and dependencies
        run: |
          pip install --no-python-version-warning --disable-pip-version-check -r requirements-devel.txt
          pip install --no-python-version-warning --disable-pip-version-check .

      - name: 🔧 Cache ccache data
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ matrix.python_version }}-${{ hashFiles('requirements.txt', 'requirements-devel.txt') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.python_version }}-
            ccache-${{ runner.os }}-

      - name: 🔧 Cache Nuitka downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/Nuitka/downloads
          key: nuitka-downloads-${{ runner.os }}-${{ runner.arch }}
          restore-keys: nuitka-downloads-${{ runner.os }}-

      - name: Verbose scons output in compilation
        run: |
          set -x

          cleanupEmptyModuleOutputs() {
            rm -rf EmptyModuleTest EmptyModuleTest.*
          }

          retryMacCompileCommand() {
            cleanupEmptyModuleOutputs

            if "$@"; then
              return 0
            fi

            echo "Retrying once after 30 seconds to tolerate a transient macOS runner failure."
            sleep 30

            cleanupEmptyModuleOutputs

            "$@"
            return $?
          }

          retryMacCompileCommand python -m nuitka --mode=module --show-scons --run --report=compilation-report-module.xml --assume-yes-for-downloads tests/basics/EmptyModuleTest.py
          retryMacCompileCommand python -m nuitka --mode=accelerated --show-scons --run --report=compilation-report-accelerated.xml --assume-yes-for-downloads --experimental=debug-report-traceback tests/basics/EmptyModuleTest.py
          retryMacCompileCommand python -m nuitka --mode=standalone --show-scons --run --report=compilation-report-standalone.xml --assume-yes-for-downloads --experimental=debug-report-traceback tests/basics/EmptyModuleTest.py
          retryMacCompileCommand python -m nuitka --mode=onefile --show-scons --run --report=compilation-report-onefile.xml --assume-yes-for-downloads --experimental=debug-report-traceback tests/basics/EmptyModuleTest.py

          # DLL mode has no run ability at this time.
          retryMacCompileCommand python -m nuitka --mode=dll --show-scons --report=compilation-report-dll.xml --assume-yes-for-downloads --experimental=debug-report-traceback tests/basics/EmptyModuleTest.py
        shell: bash

      - name: Archive compilation reports for empty modules
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compilation-reports-${{ runner.os }}-${{ matrix.python_version }}

          path: |
            *.xml

      - name: 🐞 Check all modes for debug output
        run: |
          set -x
          python -m nuitka --mode=module --run --report=compilation-report-module.xml --debug --assume-yes-for-downloads tests/basics/EmptyModuleTest.py
          python -m nuitka --mode=accelerated --run --report=compilation-report-accelerated.xml --debug --assume-yes-for-downloads --experimental=debug-report-traceback tests/basics/EmptyModuleTest.py
          python -m nuitka --mode=standalone --run --report=compilation-report-standalone.xml --debug --assume-yes-for-downloads --experimental=debug-report-traceback tests/basics/EmptyModuleTest.py
          python -m nuitka --mode=onefile --run --report=compilation-report-onefile.xml --debug --assume-yes-for-downloads --experimental=debug-report-traceback tests/basics/EmptyModuleTest.py

          # DLL mode has no run ability at this time.
          python -m nuitka --mode=dll --report=compilation-report-onefile.xml --debug --assume-yes-for-downloads --experimental=debug-report-traceback tests/basics/EmptyModuleTest.py
        shell: bash

      - name: Run Nuitka test suite
        run: |
          python -m nuitka --version
          env | sort
          python ./tests/run-tests --no-other-python --skip-reflection-test --skip-all-cpython-tests --assume-yes-for-downloads

  windows:
