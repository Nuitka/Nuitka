name: Nuitka tests
# makes little sense, spell-checker: disable
on:
  pull_request:
    branches:
      - develop
    paths-ignore:
      - "doc/**"
      - "*.md"
      - "*.rst"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.yml"
  push:
    branches:
      - main
      - develop
      - factory
      - release/**
      - hotfix/**
    paths-ignore:
      - "doc/**"
      - "*.md"
      - "*.rst"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NUITKA_CACHE_DIR: ~/.cache/Nuitka

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    name: Lint
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v6

      - name: 🐍 Use Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 🧳 Install Nuitka and dependencies
        run: |
          uv pip install --system -r requirements-devel.txt
          uv pip install --system .

      - name: 🔎 PyLint on Nuitka source code
        env:
          PYLINT_EXTRA_OPTIONS: "--jobs=0"
        run: |
          python ./bin/check-nuitka-with-pylint

      - name: 🔎 RestLint on Nuitka source code
        run: |
          python ./bin/check-nuitka-with-restlint

      - name: 🔎 YamlLint on Nuitka source code
        run: |
          python ./bin/check-nuitka-with-yamllint

      - name: 🔎 Codespell on Nuitka source code
        run: |
          python ./bin/check-nuitka-with-codespell

  formatting:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    name: Formatting
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v6

      - name: 🐍 Use Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 🗄️ Cache Nuitka downloads and autoformat
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Nuitka/downloads
            ~/.cache/Nuitka/autoformat
          key: nuitka-formatting-${{ runner.os }}-${{ hashFiles('nuitka/utils/requirements-private.txt') }}
          restore-keys: |
            nuitka-formatting-${{ runner.os }}-

      - name: 🧳 Install Nuitka and dependencies
        run: |
          uv pip install --system -r requirements-devel.txt
          uv pip install --system .

      - name: 🔎 Auto-format check on Nuitka source code
        run: |
          python ./bin/autoformat-nuitka-source --check-only --assume-yes-for-downloads

  codegen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    name: Code generation
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v6

      - name: 🐍 Use Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 🗄️ Cache Nuitka downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/Nuitka/downloads
          key: nuitka-downloads-${{ runner.os }}-${{ hashFiles('nuitka/utils/requirements-private.txt') }}
          restore-keys: |
            nuitka-downloads-${{ runner.os }}-

      - name: 🧳 Install Nuitka and dependencies
        run: |
          uv pip install --system -r requirements-devel.txt
          uv pip install --system .

      - name: 🔎 Specialized C code check
        run: |
          python ./bin/generate-specialized-c-code --check

      - name: 🔎 Specialized Python code check
        run: |
          python ./bin/generate-specialized-python-code --check

  matrix-setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      linux-versions: ${{ steps.set.outputs.linux-versions }}
      macos-versions: ${{ steps.set.outputs.macos-versions }}
      windows-versions: ${{ steps.set.outputs.windows-versions }}
      windows-arm-versions: ${{ steps.set.outputs.windows-arm-versions }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'linux-versions=["3.10","3.13"]' >> "$GITHUB_OUTPUT"
            echo 'macos-versions=["3.10","3.13"]' >> "$GITHUB_OUTPUT"
            echo 'windows-versions=["3.10","3.13"]' >> "$GITHUB_OUTPUT"
            echo 'windows-arm-versions=["3.13"]' >> "$GITHUB_OUTPUT"
          else
            echo 'linux-versions=["3.8","3.9","3.10","3.11","3.12","3.13"]' >> "$GITHUB_OUTPUT"
            echo 'macos-versions=["3.9","3.10","3.11","3.12","3.13"]' >> "$GITHUB_OUTPUT"
            echo 'windows-versions=["3.7","3.8","3.9","3.10","3.11","3.12","3.13"]' >> "$GITHUB_OUTPUT"
            echo 'windows-arm-versions=["3.11","3.12","3.13"]' >> "$GITHUB_OUTPUT"
          fi

  linux:
    needs: matrix-setup
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CCACHE_DIR: /home/runner/.cache/Nuitka/ccache
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        python_version: ${{ fromJSON(needs.matrix-setup.outputs.linux-versions) }}
    name: Ubuntu Python ${{ matrix.python_version }}
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v6

      - name: 🐍 Use Python ${{ matrix.python_version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 🗄️ Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: patchelf gdb ccache libfuse2
          version: 1.0

      - name: 🗄️ Cache Nuitka downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/Nuitka/downloads
          key: nuitka-downloads-${{ runner.os }}-${{ matrix.python_version }}-${{ hashFiles('nuitka/utils/requirements-private.txt') }}
          restore-keys: |
            nuitka-downloads-${{ runner.os }}-${{ matrix.python_version }}-
            nuitka-downloads-${{ runner.os }}-

      - name: 🗄️ Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ matrix.python_version }}

      - name: 🧳 Install Nuitka and dependencies
        run: |
          uv pip install --system -r requirements-devel.txt
          uv pip install --system .

      - name: ⚙️ Verbose scons output in compilation
        run: |
          set -x
          python -m nuitka --mode=module --show-scons --run --report=compilation-report-module.xml --assume-yes-for-downloads --experimental=debug-report-traceback tests/basics/EmptyModuleTest.py
          python -m nuitka --mode=accelerated --show-scons --run --report=compilation-report-accelerated.xml --assume-yes-for-downloads --experimental=debug-report-traceback tests/basics/EmptyModuleTest.py
          python -m nuitka --mode=standalone --show-scons --run --report=compilation-report-standalone.xml --assume-yes-for-downloads --experimental=debug-report-traceback tests/basics/EmptyModuleTest.py
          readelf -d EmptyModuleTest.dist/EmptyModuleTest.bin | tee standalone-binary-readelf.txt
          ldd EmptyModuleTest.dist/EmptyModuleTest.bin | tee standalone-binary-ldd.txt
          python -m nuitka --mode=onefile --show-scons --run --report=compilation-report-onefile.xml --assume-yes-for-downloads --experimental=debug-report-traceback tests/basics/EmptyModuleTest.py
        shell: bash

      - name: 📤 Archive compilation reports for empty modules
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compilation-reports-${{ runner.os }}-${{ matrix.python_version }}
          path: |
            *.xml
            standalone-binary-readelf.txt
            standalone-binary-ldd.txt

      - name: 🧪 Run Nuitka test suite
        run: |
          python -m nuitka --version
          env | sort
          python ./tests/run-tests --no-other-python --skip-reflection-test --skip-all-cpython-tests --assume-yes-for-downloads

  mac-python3:
    needs: matrix-setup
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      CCACHE_DIR: /Users/runner/.cache/Nuitka/ccache
    strategy:
      fail-fast: false
      matrix:
        python_version: ${{ fromJSON(needs.matrix-setup.outputs.macos-versions) }}
    name: macOS Python ${{ matrix.python_version }}
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v6

      - name: 🐍 Use Python ${{ matrix.python_version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}

      - name: ⚙️ Verbose installation output for Python
        run: |
          set -x
          which python
          otool -L $(which python)
          otool -l $(which python)
          ls -lR $(dirname $(dirname $(which python)))

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 🗄️ Cache Nuitka downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/Nuitka/downloads
          key: nuitka-downloads-${{ runner.os }}-${{ matrix.python_version }}-${{ hashFiles('nuitka/utils/requirements-private.txt') }}
          restore-keys: |
            nuitka-downloads-${{ runner.os }}-${{ matrix.python_version }}-
            nuitka-downloads-${{ runner.os }}-

      - name: 🗄️ Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ matrix.python_version }}

      - name: 🧳 Install Nuitka and dependencies
        run: |
          uv pip install --system -r requirements-devel.txt
          uv pip install --system .

      - name: Verbose scons output in compilation
        run: |
          set -x

          cleanupEmptyModuleOutputs() {
            rm -rf EmptyModuleTest EmptyModuleTest.*
          }

          retryMacCompileCommand() {
            cleanupEmptyModuleOutputs

            if "$@"; then
              return 0
            fi

            echo "Retrying once after 30 seconds to tolerate a transient macOS runner failure."
            sleep 30

            cleanupEmptyModuleOutputs

            "$@"
            return $?
          }

          retryMacCompileCommand python -m nuitka --mode=module --show-scons --run --report=compilation-report-module.xml --assume-yes-for-downloads tests/basics/EmptyModuleTest.py
          retryMacCompileCommand python -m nuitka --mode=accelerated --show-scons --run --report=compilation-report-accelerated.xml --assume-yes-for-downloads --experimental=debug-report-traceback tests/basics/EmptyModuleTest.py
          retryMacCompileCommand python -m nuitka --mode=standalone --show-scons --run --report=compilation-report-standalone.xml --assume-yes-for-downloads --experimental=debug-report-traceback tests/basics/EmptyModuleTest.py
          retryMacCompileCommand python -m nuitka --mode=onefile --show-scons --run --report=compilation-report-onefile.xml --assume-yes-for-downloads --experimental=debug-report-traceback tests/basics/EmptyModuleTest.py

          # DLL mode has no run ability at this time.
          retryMacCompileCommand python -m nuitka --mode=dll --show-scons --report=compilation-report-dll.xml --assume-yes-for-downloads --experimental=debug-report-traceback tests/basics/EmptyModuleTest.py
        shell: bash

      - name: Archive compilation reports for empty modules
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compilation-reports-${{ runner.os }}-${{ matrix.python_version }}
          path: |
            *.xml

      - name: Run Nuitka test suite
        run: |
          python -m nuitka --version
          env | sort
          python ./tests/run-tests --no-other-python --skip-reflection-test --skip-all-cpython-tests --assume-yes-for-downloads

  windows:
    needs: matrix-setup
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        python_version: ${{ fromJSON(needs.matrix-setup.outputs.windows-versions) }}
    name: Windows Python ${{ matrix.python_version }}
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v6

      - name: 🐍 Use Python ${{ matrix.python_version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}

      - uses: ilammy/msvc-dev-cmd@v1

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 🗄️ Cache Nuitka downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/Nuitka/downloads
          key: nuitka-downloads-${{ runner.os }}-${{ matrix.python_version }}-${{ hashFiles('nuitka/utils/requirements-private.txt') }}
          restore-keys: |
            nuitka-downloads-${{ runner.os }}-${{ matrix.python_version }}-
            nuitka-downloads-${{ runner.os }}-

      - name: 🧳 Install Nuitka and dependencies
        run: |
          uv pip install --system -r requirements-devel.txt
          uv pip install --system .

      - name: Verbose scons output in compilation
        run: |
          set -x
          python -m nuitka --mode=module --show-scons --run --report=compilation-report-module.xml --assume-yes-for-downloads --experimental=debug-report-traceback tests/basics/EmptyModuleTest.py
          python -m nuitka --mode=accelerated --show-scons --run --report=compilation-report-accelerated.xml --assume-yes-for-downloads --experimental=debug-report-traceback tests/basics/EmptyModuleTest.py
          python -m nuitka --mode=standalone --show-scons --run --report=compilation-report-standalone.xml --assume-yes-for-downloads --experimental=debug-report-traceback tests/basics/EmptyModuleTest.py
          python -m nuitka --mode=onefile --show-scons --run --report=compilation-report-onefile.xml --assume-yes-for-downloads --experimental=debug-report-traceback tests/basics/EmptyModuleTest.py
        shell: bash

      - name: Archive compilation reports for empty modules
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compilation-reports-${{ runner.os }}-${{ matrix.python_version }}
          path: |
            *.xml

      - name: Run Nuitka test suite
        run: |
          Get-ChildItem env:
          python -m nuitka --version
          python .\tests\run-tests --no-other-python --no-debug --skip-reflection-test --skip-all-cpython-tests --assume-yes-for-downloads

  windows-arm:
    needs: matrix-setup
    runs-on: windows-11-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python_version: ${{ fromJSON(needs.matrix-setup.outputs.windows-arm-versions) }}
    name: Windows ARM Python ${{ matrix.python_version }}
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v6

      - name: 🐍 Use Python ${{ matrix.python_version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 🗄️ Cache Nuitka downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/Nuitka/downloads
          key: nuitka-downloads-${{ runner.os }}-arm64-${{ matrix.python_version }}-${{ hashFiles('nuitka/utils/requirements-private.txt') }}
          restore-keys: |
            nuitka-downloads-${{ runner.os }}-arm64-${{ matrix.python_version }}-
            nuitka-downloads-${{ runner.os }}-arm64-

      - name: 🧳 Install Nuitka and dependencies
        run: |
          uv pip install --system -r requirements-devel.txt
          uv pip install --system .

      - name: Verbose scons output in compilation
        run: |
          set -x
          python -m nuitka --mode=module --show-scons --run --report=compilation-report-module.xml --assume-yes-for-downloads --experimental=debug-report-traceback tests/basics/EmptyModuleTest.py
          python -m nuitka --mode=accelerated --show-scons --run --report=compilation-report-accelerated.xml --assume-yes-for-downloads --experimental=debug-report-traceback tests/basics/EmptyModuleTest.py
          python -m nuitka --mode=standalone --show-scons --run --report=compilation-report-standalone.xml --assume-yes-for-downloads --experimental=debug-report-traceback tests/basics/EmptyModuleTest.py
          python -m nuitka --mode=onefile --show-scons --run --report=compilation-report-onefile.xml --assume-yes-for-downloads --experimental=debug-report-traceback tests/basics/EmptyModuleTest.py
        shell: bash

      - name: Archive compilation reports for empty modules
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compilation-reports-${{ runner.os }}-arm64-${{ matrix.python_version }}
          path: |
            *.xml

      - name: Run Nuitka test suite
        run: |
          Get-ChildItem env:
          python -m nuitka --version
          python .\tests\run-tests --no-other-python --no-debug --skip-reflection-test --skip-all-cpython-tests --assume-yes-for-downloads
