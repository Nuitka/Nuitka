      matrix:
        python_version:
          - "3.7"
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    name: Windows Python ${{ matrix.python_version }}
    steps:
      - name: 🛎️ Checkout
        uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea # v3.8.0
        with:
          action: actions/checkout@v4
          with: |
            fetch-depth: 1
            fetch-tags: false
            filter: blob:none
