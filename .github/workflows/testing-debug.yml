name: Nuitka debug tests
# makes little sense, spell-checker: disable
on:
  pull_request:
    branches:
      - develop
    paths-ignore:
      - "doc/**"
      - "*.md"
      - "*.rst"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.yml"
  push:
    branches:
      - main
      - develop
      - factory
      - release/**
      - hotfix/**
    paths-ignore:
      - "doc/**"
      - "*.md"
      - "*.rst"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NUITKA_CACHE_DIR: ~/.cache/Nuitka

jobs:
  matrix-setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      macos-versions: ${{ steps.set.outputs.macos-versions }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'macos-versions=["3.10","3.13"]' >> "$GITHUB_OUTPUT"
          else
            echo 'macos-versions=["3.9","3.10","3.11","3.12","3.13"]' >> "$GITHUB_OUTPUT"
          fi

  mac-debug:
    needs: matrix-setup
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      CCACHE_DIR: ~/.cache/Nuitka/ccache
    strategy:
      fail-fast: false
      matrix:
        python_version: ${{ fromJSON(needs.matrix-setup.outputs.macos-versions) }}
    name: macOS Debug Python ${{ matrix.python_version }}
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v6

      - name: 🐍 Use Python ${{ matrix.python_version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 🗄️ Cache Nuitka downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/Nuitka/downloads
          key: nuitka-downloads-${{ runner.os }}-${{ matrix.python_version }}-${{ hashFiles('nuitka/utils/requirements-private.txt') }}
          restore-keys: |
            nuitka-downloads-${{ runner.os }}-${{ matrix.python_version }}-
            nuitka-downloads-${{ runner.os }}-

      - name: 🗄️ Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-debug-${{ matrix.python_version }}

      - name: 🧳 Install Nuitka and dependencies
        run: |
          uv pip install --system -r requirements-devel.txt
          uv pip install --system .

      - name: 🐞 Check all modes for debug output
        run: |
          set -x
          python -m nuitka --mode=module --run --report=compilation-report-module.xml --debug --assume-yes-for-downloads tests/basics/EmptyModuleTest.py
          python -m nuitka --mode=accelerated --run --report=compilation-report-accelerated.xml --debug --assume-yes-for-downloads --experimental=debug-report-traceback tests/basics/EmptyModuleTest.py
          python -m nuitka --mode=standalone --run --report=compilation-report-standalone.xml --debug --assume-yes-for-downloads --experimental=debug-report-traceback tests/basics/EmptyModuleTest.py
          python -m nuitka --mode=onefile --run --report=compilation-report-onefile.xml --debug --assume-yes-for-downloads --experimental=debug-report-traceback tests/basics/EmptyModuleTest.py

          # DLL mode has no run ability at this time.
          python -m nuitka --mode=dll --report=compilation-report-onefile.xml --debug --assume-yes-for-downloads --experimental=debug-report-traceback tests/basics/EmptyModuleTest.py
        shell: bash
